<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="manifest.webmanifest"><title>Battery Repair Hub</title><style>
:root{--bg:#0b0f14;--p:#121823;--p2:#192232;--l:#273247;--t:#f8fafc;--m:#9aa6b8;--g:#22c55e;--b:#3b82f6;--r:#ef4444;--o:#f59e0b} [data-theme=light]{--bg:#f6f8fb;--p:#fff;--p2:#f1f5f9;--l:#dbe3ef;--t:#111827;--m:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1250px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:20;padding:14px;background:rgba(8,11,16,.92);backdrop-filter:blur(16px)}[data-theme=light] header{background:rgba(255,255,255,.9)}.hero{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--l);border-radius:22px;background:linear-gradient(135deg,rgba(34,197,94,.17),rgba(59,130,246,.13))}.logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#22c55e,#0ea5e9)}.brand{flex:1}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--m);font-size:11px;letter-spacing:.08em}.topBtns{display:flex;gap:8px}.btn,.tab,.primary{border:1px solid var(--l);border-radius:14px;background:var(--p);color:var(--t);font-weight:900;cursor:pointer}.btn{padding:10px}.primary{padding:12px 16px;border:0;color:#fff;background:linear-gradient(135deg,#16a34a,#0ea5e9)}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.tab{padding:11px 8px}.tab.active{background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(59,130,246,.18));border-color:rgba(34,197,94,.35)}main{padding:14px}.view{display:none}.view.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:18px}.stat,.panel{padding:14px}.stat{cursor:pointer}.stat .n{font-size:28px;font-weight:950}.stat .s{font-size:12px;color:var(--m);margin-top:4px}.card{padding:14px;margin-top:10px}.ct{display:flex;justify-content:space-between;gap:10px}.title{font-size:18px;font-weight:950}.sub,.small{font-size:12px;color:var(--m);margin-top:4px}.badge{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(59,130,246,.15);color:#60a5fa}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.box{padding:10px;border:1px solid var(--l);border-radius:13px;background:var(--p2)}.box b{display:block;font-size:11px}.box span{display:block;font-size:12px;color:var(--m);margin-top:3px}.progress{margin-top:12px}.prow{display:flex;justify-content:space-between;font-size:11px;color:var(--m);font-weight:900}.track{height:10px;border-radius:999px;background:var(--p2);overflow:hidden;border:1px solid var(--l);margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--o),var(--b),var(--g));border-radius:999px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts button{padding:9px 11px;border:1px solid var(--l);border-radius:12px;background:var(--p2);color:var(--t);font-weight:900}.acts .wa{color:var(--g)}.acts .del{color:#f87171}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar .search{flex:1}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:12px;background:var(--p2);color:var(--t)}label{display:block;font-size:12px;font-weight:900;margin:10px 0 5px}textarea{min-height:74px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{border:0;padding:0;border-radius:20px;background:var(--p);color:var(--t);width:min(96vw,700px);max-height:92vh;overflow:auto}dialog::backdrop{background:#0008}.modal{padding:18px}.modal h2{margin:0}.macts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.macts button{padding:10px 12px;border:1px solid var(--l);border-radius:12px;background:var(--p2);color:var(--t);font-weight:900}.macts .save{background:linear-gradient(135deg,#16a34a,#0ea5e9);border:0;color:white}.thumb{width:90px;height:90px;object-fit:cover;border-radius:14px;border:1px solid var(--l);margin-top:8px}.empty{text-align:center;color:var(--m);padding:28px}.photoPreview{display:none;margin-top:8px}.photoPreview img{width:100%;max-height:230px;object-fit:cover;border-radius:14px}.click{cursor:pointer}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.meta{grid-template-columns:1fr}.toolbar{flex-direction:column}.brand h1{font-size:21px}}
</style></head><body><div class="app"><header><div class="hero"><div class="logo">🔋</div><div class="brand"><h1 id="businessTitle">Battery Repair Hub</h1><p>BATERÍAS DE TALADROS · DIAGNÓSTICO · REBUILD</p></div><div class="topBtns"><button class="btn" onclick="go('dashboard')">⌂</button><button class="btn" id="themeBtn">🌙/☀️</button></div></div><div class="tabs"><button class="tab active" data-v="dashboard">Resumen</button><button class="tab" data-v="repairs">Baterías</button><button class="tab" data-v="clients">Clientes</button><button class="tab" data-v="tx">Transacciones</button><button class="tab" data-v="inv">Inventario</button><button class="tab" data-v="settings">Ajustes</button></div></header><main>

</main></div>

zo de celdas</option><option>Rebuild completo</option><option>Reparación BMS</option><option>Reparación conector</option><option>Balanceo / prueba</option><option>Otro</option></select></div></div><div class="grid2"><div><label>Estimado</label><input id="rEstimate" type="number" step=".01"></div><div><label>Depósito</label><input id="rDeposit" type="number" step=".01"></div></div><div class="grid2"><div><label>Estado</label><select id="rStatus"><option value="received">Recibida</option><option value="test">Diagnóstico</option><option value="waiting">Esperando piezas</option><option value="rebuilding">Reconstruyendo</option><option value="ready">Lista</option><option value="delivered">Entregada</option></select></div><div><label>Pago</label><select id="rPayment"><option>ATH Móvil</option><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></div></div><label>Foto</label><input id="rPhoto" type="file" accept="image/*"><div class="photoPreview" id="rPreview"><img id="rPreviewImg"></div><label>Notas</label><textarea id="rNotes"></textarea><div class="macts"><button type="button" id="rDelete" style="display:none;color:#f87171">Eliminar</button><button type="button" id="rCancel">Cancelar</button><button class="save">Guardar</button></div></form></dialog>

<dialog id="txDlg"><form class="modal" id="txForm"><h2>Transacción</h2><div class="grid2"><div><label>Fecha</label><input id="xDate" type="date"></div><div><label>Hora</label><input id="xTime" type="time"></div></div><div class="grid2"><div><label>Tipo</label><select id="xType"><option value="income">Ingreso</option><option value="expense">Gasto</option></select></div><div><label>Pago</label><select id="xPayment"><option>ATH Móvil</option><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></div></div><label>Concepto</label><input id="xConcept"><div class="grid2"><div><label>Monto</label><input id="xAmount" type="number" step=".01"></div><div><label>Cliente</label><input id="xClient"></div></div><label>Notas</label><textarea id="xNotes"></textarea><div class="macts"><button type="button" id="xCancel">Cancelar</button><button class="save">Guardar</button></div></form></dialog>

<script>
const K='battery_repair_hub_v1';let d=JSON.parse(localStorage.getItem(K)||'null')||{settings:{businessName:'Battery Repair Hub',businessPhone:'',theme:'dark',footerNote:'Gracias por preferirnos'},repairs:[],clients:[],tx:[],inv:[]};d.repairs||=[];d.clients||=[];d.tx||=[];d.inv||=[];let er=null,ec=null,ex=null,ei=null;const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(d)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),money=n=>'$'+Number(n||0).toFixed(2);function today(){const x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}function now(){const x=new Date();return `${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`}function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v))}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>go(x.dataset.v));function sl(s){return {received:'Recibida',test:'Diagnóstico',waiting:'Esperando piezas',rebuilding:'Reconstruyendo',ready:'Lista',delivered:'Entregada'}[s]||s}function prog(s){return {received:15,test:35,waiting:55,rebuilding:75,ready:90,delivered:100}[s]||15}function ph(p){return (p||'').replace(/\D/g,'')}function wa(p,m){window.open(`https://wa.me/${ph(p)}?text=${encodeURIComponent(m)}`,'_blank')}async function photo(f){if(!f)return'';const u=await new Promise((r,j)=>{const q=new FileReader();q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)});return u}function render(){document.documentElement.dataset.theme=d.settings.theme;$('businessTitle').textContent=d.settings.businessName;$('businessName').value=d.settings.businessName;$('businessPhone').value=d.settings.businessPhone;$('themeSelect').value=d.settings.theme;$('footerNote').value=d.settings.footerNote;renderDash();renderRepairs($('repairSearch').value||'');renderClients($('clientSearch').value||'');renderTx($('txSearch').value||'');renderInv($('invSearch').value||'')}function renderDash(){$('sOpen').textContent=d.repairs.filter(x=>x.status!=='delivered').length;$('sReady').textContent=d.repairs.filter(x=>x.status==='ready').length;$('sClients').textContent=d.clients.length;const t=today(),a=d.tx.filter(x=>x.date===t),bal=a.reduce((s,x)=>s+(x.type==='expense'?-x.amount:x.amount),0);$('sToday').textContent=money(bal);$('recent').innerHTML=d.repairs.slice(-5).reverse().map(x=>`<div class=small><b>${x.brand} ${x.model}</b><br>${sl(x.status)}</div>`).join('')||'<div class=empty>Sin trabajos.</div>';const c={};d.repairs.forEach(x=>c[x.brand]=(c[x.brand]||0)+1);$('brands').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=small><b>${k}</b> · ${v}</div>`).join('')||'<div class=empty>Sin datos.</div>';const inc=a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);$('todayBox').innerHTML=`<div class=small>Ingresos: <b>${money(inc)}</b></div><div class=small>Gastos: <b>${money(exp)}</b></div>`}function renderRepairs(q=''){q=q.toLowerCase();const a=d.repairs.filter(x=>(`${x.client} ${x.brand} ${x.model} ${x.voltage} ${x.work}`).toLowerCase().includes(q));$('repairList').innerHTML=a.length?'':'<div class=empty>No hay baterías.</div>';a.slice().reverse().forEach(x=>{const c=document.createElement('div');c.className='card click';c.onclick=e=>{if(e.target.closest('button'))return;openRepair(x.id)};c.innerHTML=`<div class=ct><div><div class=title>${x.brand} ${x.model||''}</div><div class=sub>${x.client||'Cliente'} · ${x.voltage||''} · ${x.capacity||''}</div>${x.photo?`<img class=thumb src="${x.photo}">`:''}</div><span class=badge>${sl(x.status)}</span></div><div class=progress><div class=prow><span>Proceso</span><span>${prog(x.status)}%</span></div><div class=track><div class=fill style="width:${prog(x.status)}%"></div></div></div><div class=meta><div class=box><b>Diagnóstico</b><span>${x.diagnosis||'—'}</span></div><div class=box><b>Trabajo</b><span>${x.work||'—'}</span></div><div class=box><b>Celdas</b><span>${x.cells||'—'} ${x.cellType||''}</span></div><div class=box><b>Balance</b><span>${money(x.estimate-x.deposit)}</span></div></div><div class=acts><button onclick="openRepair('${x.id}')">Editar</button>${x.phone?`<button class=wa onclick="wa('${x.phone}',msg(getR('${x.id}')))">WhatsApp</button>`:''}<button onclick="setStatus('${x.id}','rebuilding')">Proceso</button><button onclick="setStatus('${x.id}','ready')">Lista</button><button onclick="setStatus('${x.id}','delivered')">Entregada</button><button class=del onclick="delR('${x.id}')">Eliminar</button></div>`;$('repairList').appendChild(c)})}function msg(x){return `${d.settings.businessName}\nBatería: ${x.brand} ${x.model}\nVoltaje: ${x.voltage}\nTrabajo: ${x.work}\nEstado: ${sl(x.status)} (${prog(x.status)}%)\nEstimado: ${money(x.estimate)}\nBalance: ${money(x.estimate-x.deposit)}`}function renderClients(q=''){q=q.toLowerCase();const a=d.clients.filter(x=>(`${x.name} ${x.phone} ${x.brand}`).toLowerCase().includes(q));$('clientList').innerHTML=a.map(x=>`<div class=card><div class=ct><div><div class=title>${x.name}</div><div class=sub>${x.phone||''} ${x.email||''}</div></div></div><div class=acts>${x.phone?`<button class=wa onclick="wa('${x.phone}','Hola ${x.name}')">WhatsApp</button>`:''}<button onclick="openClient('${x.id}')">Editar</button></div></div>`).join('')||'<div class=empty>No hay clientes.</div>'}function renderTx(q=''){q=q.toLowerCase();let inc=0,exp=0;const a=d.tx.filter(x=>(`${x.concept} ${x.client} ${x.payment}`).toLowerCase().includes(q));$('txList').innerHTML=a.slice().reverse().map(x=>{x.type==='expense'?exp+=x.amount:inc+=x.amount;return `<div class=card><div class=ct><div><div class=title>${x.concept}</div><div class=sub>${x.client||''} · ${x.date} ${x.time}</div></div><span class=badge>${x.type==='expense'?'-':'+'}${money(x.amount)}</span></div><div class=acts><button onclick="openTx('${x.id}')">Editar</button></div></div>`}).join('')||'<div class=empty>No hay transacciones.</div>';$('txInc').textContent=money(inc);$('txExp').textContent=money(exp);$('txBal').textContent=money(inc-exp)}function renderInv(q=''){q=q.toLowerCase();const a=d.inv.filter(x=>(`${x.name} ${x.brand}`).toLowerCase().includes(q));$('invList').innerHTML=a.map(x=>`<div class=card><div class=ct><div><div class=title>${x.name}</div><div class=sub>${x.brand||''}</div></div><span class=badge>${x.qty} unidades</span></div><div class=meta><div class=box><b>Costo</b><span>${money(x.cost)}</span></div><div class=box><b>Valor</b><span>${money(x.cost*x.qty)}</span></div></div><div class=acts><button onclick="openInv('${x.id}')">Editar</button></div></div>`).join('')||'<div class=empty>No hay inventario.</div>'}function getR(id){return d.repairs.find(x=>x.id===id)}function openRepair(id=null){er=id;const x=id?getR(id):{};$('repairTitle').textContent=id?'Editar batería':'Nueva batería';['Date','Time','Client','Phone','Model','Capacity','Cells','InputV','OutputV','Issue','Estimate','Deposit','Notes'].forEach(k=>{$('r'+k).value=x[k.charAt(0).toLowerCase()+k.slice(1)]??''});$('rDate').value=x.date||today();$('rTime').value=x.time||now();$('rBrand').value=x.brand||'DeWalt';$('rVoltage').value=x.voltage||'20V';$('rCellType').value=x.cellType||'18650';$('rDiagnosis').value=x.diagnosis||'Celdas degradadas';$('rWork').value=x.work||'Diagnóstico';$('rStatus').value=x.status||'received';$('rPayment').value=x.payment||'ATH Móvil';$('rDelete').style.display=id?'inline-block':'none';$('rPreview').style.display=x.photo?'block':'none';if(x.photo)$('rPreviewImg').src=x.photo;$('repairDlg').showModal()}function openClient(id=null){ec=id;const x=id?d.clients.find(y=>y.id===id):{};$('cName').value=x.name||'';$('cPhone').value=x.phone||'';$('cEmail').value=x.email||'';$('cBrand').value=x.brand||'';$('cNotes').value=x.notes||'';$('clientDlg').showModal()}function openTx(id=null){ex=id;const x=id?d.tx.find(y=>y.id===id):{};$('xDate').value=x.date||today();$('xTime').value=x.time||now();$('xType').value=x.type||'income';$('xPayment').value=x.payment||'ATH Móvil';$('xConcept').value=x.concept||'';$('xAmount').value=x.amount??'';$('xClient').value=x.client||'';$('xNotes').value=x.notes||'';$('txDlg').showModal()}function openInv(id=null){ei=id;const x=id?d.inv.find(y=>y.id===id):{};$('iName').value=x.name||'';$('iBrand').value=x.brand||'';$('iQty').value=x.qty??1;$('iCost').value=x.cost??'';$('iNotes').value=x.notes||'';$('invDlg').showModal()}function setStatus(id,s){const x=getR(id);if(x){x.status=s;save();render()}}function delR(id){if(confirm('¿Eliminar batería?')){d.repairs=d.repairs.filter(x=>x.id!==id);save();render()}}$('repairForm').onsubmit=async e=>{e.preventDefault();let x=er?getR(er):{id:uid()};let photoUrl=x.photo||'';if($('rPhoto').files[0])photoUrl=await photo($('rPhoto').files[0]);Object.assign(x,{date:$('rDate').value,time:$('rTime').value,client:$('rClient').value,phone:$('rPhone').value,brand:$('rBrand').value,model:$('rModel').value,voltage:$('rVoltage').value,capacity:$('rCapacity').value,cellType:$('rCellType').value,cells:Number($('rCells').value||0),inputV:Number($('rInputV').value||0),outputV:Number($('rOutputV').value||0),issue:$('rIssue').value,diagnosis:$('rDiagnosis').value,work:$('rWork').value,estimate:Number($('rEstimate').value||0),deposit:Number($('rDeposit').value||0),status:$('rStatus').value,payment:$('rPayment').value,photo:photoUrl,notes:$('rNotes').value});if(!er)d.repairs.push(x);save();$('repairDlg').close();render()};$('clientForm').onsubmit=e=>{e.preventDefault();let x=ec?d.clients.find(y=>y.id===ec):{id:uid()};Object.assign(x,{name:$('cName').value,phone:$('cPhone').value,email:$('cEmail').value,brand:$('cBrand').value,notes:$('cNotes').value});if(!ec)d.clients.push(x);save();$('clientDlg').close();render()};$('txForm').onsubmit=e=>{e.preventDefault();let x=ex?d.tx.find(y=>y.id===ex):{id:uid()};Object.assign(x,{date:$('xDate').value,time:$('xTime').value,type:$('xType').value,payment:$('xPayment').value,concept:$('xConcept').value,amount:Number($('xAmount').value||0),client:$('xClient').value,notes:$('xNotes').value});if(!ex)d.tx.push(x);save();$('txDlg').close();render()};$('invForm').onsubmit=e=>{e.preventDefault();let x=ei?d.inv.find(y=>y.id===ei):{id:uid()};Object.assign(x,{name:$('iName').value,brand:$('iBrand').value,qty:Number($('iQty').value||0),cost:Number($('iCost').value||0),notes:$('iNotes').value});if(!ei)d.inv.push(x);save();$('invDlg').close();render()};$('newRepair').onclick=()=>openRepair();$('newClient').onclick=()=>openClient();$('newTx').onclick=()=>openTx();$('newInv').onclick=()=>openInv();$('rCancel').onclick=()=>$('repairDlg').close();$('cCancel').onclick=()=>$('clientDlg').close();$('xCancel').onclick=()=>$('txDlg').close();$('iCancel').onclick=()=>$('invDlg').close();$('rDelete').onclick=()=>{if(er){delR(er);$('repairDlg').close()}};$('repairSearch').oninput=e=>renderRepairs(e.target.value);$('clientSearch').oninput=e=>renderClients(e.target.value);$('txSearch').oninput=e=>renderTx(e.target.value);$('invSearch').oninput=e=>renderInv(e.target.value);$('themeBtn').onclick=()=>{d.settings.theme=d.settings.theme==='dark'?'light':'dark';save();render()};$('saveSettings').onclick=()=>{d.settings.businessName=$('businessName').value||'Battery Repair Hub';d.settings.businessPhone=$('businessPhone').value;d.settings.theme=$('themeSelect').value;d.settings.footerNote=$('footerNote').value;save();render();alert('Guardado')};render();
</script></body></html>
